---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: fedora-xfce
# description will be included in the image's metadata
description: Mi distribución atómica personalizada con escritorio Xfce.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/fedora-穩/kinoite
image-version: 44

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: rpm-ostree
    files:
      # 1. ENTORNO DE ESCRITORIO XFCE NATIVO Y COMPLETO
      - xfce4-session
      - xfce4-panel
      - xfwm4
      - xfdesktop
      - thunar
      - xfce4-terminal
      - xfce4-settings
      - xfce4-power-manager
      - xfconf
      - lightdm
      - lightdm-gtk-greeter
      - network-manager-applet

      # 2. CAPA DE JUEGOS Y COMPATIBILIDAD (WINE COMPLETO CON SOPORTE i386)
      - lutris
      - wine
      - wine-core.i686
      - wine-core.x86_64
      - wine-common
      - wine-desktop
      - wine-fonts
      - wine-gecko
      - wine-mono
      - glibc.i686

      # 3. CONTROLADORES CLÁSICOS Y ACELERACIÓN GRÁFICA (RADEON HD 4550)
      - xorg-x11-drv-ati
      - mesa-dri-drivers
      - mesa-dri-drivers.i686
      - libva-vdpau-driver
      - libva-vdpau-driver.i686
      - mesa-vdpau-drivers
      - mesa-vau-drivers.i686

      # 4. OPTIMIZACIONES PARA INTEL CORE 2 DUO E6550
      - microcode_ctl        # Microcódigo oficial de Intel para parches de estabilidad
      - lm_sensors           # Control de temperaturas de hardware viejo
      - irqbalance           # Distribución eficiente de hilos en CPU de 2 núcleos

      # 5. SOPORTE DE IDIOMA DESDE LA INSTALACIÓN
      - langpacks-es
      - xfce4-l10n
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
    remove:
      packages:
        - plasma-desktop       # Quitamos el escritorio pesado de KDE Kinoite base
        - sddm                 # Quitamos el gestor de KDE para usar LightDM
        - mesa-vulkan-drivers  # Descartado: Tu hardware no posee soporte para Vulkan
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
      - com.brave.Browser
      - org.telegram.desktop
      - org.videolan.VLC
      - org.freedesktop.Platform.ffmpeg6  # Runtime de FFmpeg para Flatpak
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
